<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- A client's trip page is fetched from the database once they have signed in, and its script is run from
     memory: that is what blob: allows here and on no other page. Nothing written into a page can use it,
     only a script already running. Styles may be inline because trip pages are written that way. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Your trip | The Corner World</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="../assets/trip-view.css?v=e558115e" id="tv-style">
</head>
<body>
<main class="tv" id="tv">
  <p class="tv-brand"><a href="../">The Corner World</a></p>
  <h1 class="tv-title" id="tv-title">Your trip</h1>
  <p class="tv-text" id="tv-text" role="status">Opening&hellip;</p>
  <div class="tv-actions" id="tv-actions"></div>
  <noscript><p class="tv-text">Your trip page needs JavaScript switched on.</p></noscript>
</main>
<script src="../assets/account.js?v=dbaf82f4" data-url="" data-key="" data-lib="../assets/lib/supabase.js?v=a867edbc"></script>

</body>
</html>
