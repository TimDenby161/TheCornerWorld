<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- GitHub Pages can't send security headers, so the policy is here. Everything is served from this
     site: no inline script or styles, no outside images or connections. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>The Corner World</title>
<meta name="description" content="Explore the world on a map: every country scored for food, activities, value, families and safety.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Corner World">
<meta name="theme-color" content="#2a78d6">
<script src="assets/theme.js?v=ae737992"></script>
<link rel="stylesheet" href="assets/styles.css?v=94e0ad3d">
<link rel="stylesheet" href="assets/home.css?v=80d9e80d">
</head>
<body class="home">
<a class="skip-link" href="#panel">Skip to content</a>

<header class="topbar">
  <p class="brand glass"><span class="brand-mark" aria-hidden="true"></span><span>The Corner World</span></p>
  <nav class="links glass" aria-label="Site">
    <span class="mode">
      <a href="./" class="on" aria-current="page">Discover</a>
      <a href="samples/">Samples</a>
      <a href="plan/">Book</a>
    </span>
    <button type="button" class="round" id="theme-btn" aria-label="Switch between light and dark">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </nav>
</header>

<main class="layout">
  <section class="stage" aria-label="World map">
    <div class="globe" id="globe" tabindex="0" role="group" aria-label="World map. The arrow keys turn it, and plus and minus zoom. The search box picks a country without the map.">
      <canvas id="map-base" aria-hidden="true"></canvas>
      <canvas id="map-over" aria-hidden="true"></canvas>
    </div>
    <div class="tip glass" id="tip" hidden></div>

    <p class="legend glass"><span class="scale-key">Score <span class="scale-bar" aria-hidden="true"></span><span class="sr-only">from low (red) to high (green)</span></span></p>

    <div class="cue">
      <p class="hint" id="hint" aria-hidden="true"></p>
      <button type="button" class="surprise" id="surprise">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
        <span id="surprise-text">Surprise me</span>
      </button>
    </div>

    <div class="tools">
      <div class="seg glass" id="view-seg" role="group" aria-label="Map view" data-on="0">
        <button type="button" data-view="globe" aria-pressed="true">Globe</button>
        <button type="button" data-view="flat" aria-pressed="false">Flat</button>
      </div>
      <div class="zoom glass">
        <button type="button" id="zoom-in" aria-label="Zoom in"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <button type="button" id="zoom-out" aria-label="Zoom out"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <button type="button" id="zoom-reset" aria-label="Show the whole world"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>
  </section>

  <section class="sheet glass" id="sheet" aria-label="Destinations">
    <div class="sheet-head" id="sheet-head">
      <span class="grip" aria-hidden="true"></span>
    </div>
    <div class="panel" id="panel" tabindex="-1">
      <p class="loading">Loading the map&hellip;</p>
    </div>
  </section>
</main>


<script src="assets/lib/d3.min.js?v=f2094bbf"></script>
<script src="assets/lib/topojson-client.min.js?v=25cd02ae"></script>
<script src="assets/globe.js?v=d7c43643"></script>
<script src="assets/app.js?v=9734c863"></script>
</body>
</html>
