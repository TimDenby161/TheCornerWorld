# A copy of the site's Supabase project that runs on this computer, for the database tests
# (`npm run test:db`) and for trying things out before they go near the real project. Start it with
# `npm run db:start` and stop it with `npm run db:stop`. Docker has to be running.
#
# Only what the site uses is switched on: the database, sign-in (auth) and the data API. The ports are
# 553xx rather than Supabase's usual 543xx so it can run beside another project's local copy.
#
# This file does not configure the real project. Its sign-in settings are set in the Supabase dashboard:
# the README lists them under "Accounts and sign-in".
project_id = "thecornerworld"

[api]
port = 55321
# Only the `public` schema can be reached from a browser. The `private` schema (who is an admin, and the
# functions the access rules call) is deliberately not listed.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false

[auth]
site_url = "http://localhost:8000/"
additional_redirect_urls = ["http://localhost:8000/trip/", "http://localhost:8000/admin/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

# Sign-in is by Google only, so email sign-up and passwords are off, as on the real project.
[auth.email]
enable_signup = false

[realtime]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
