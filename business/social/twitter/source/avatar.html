<!doctype html>
<html><head><meta charset="utf-8">
<style>html, body { margin: 0; overflow: hidden; background: #fff; } svg { display: block; width: 1024px; height: 1024px; }</style>
</head><body>
<!-- The globe mark, full-bleed: ocean blue top-left, land green bottom-right. Render at any square size. -->
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="#1baf7a"/>
  <polygon points="0,0 64,0 0,64" fill="#2a78d6"/>
  <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round">
    <circle cx="32" cy="32" r="15"/>
    <ellipse cx="32" cy="32" rx="6.5" ry="15"/>
    <line x1="17" y1="32" x2="47" y2="32"/>
  </g>
</svg>
</body></html>
